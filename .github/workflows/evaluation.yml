name: Evaluation

# The grounding evaluation calls a real model, so it is deliberately kept
# out of the per-push CI workflow: it costs money per run and its failures
# are statistical rather than binary. It runs weekly and on demand instead,
# and publishes the metric table as a job summary so regressions in
# citation coverage or injection resistance are visible over time.
#
# Unlike CI, this needs the WHOLE stack, not a couple of service
# containers: each fixture is uploaded through the real upload endpoint
# (object storage + malware scan + parse + chunk + embed via Celery) and
# then asked through the real agent-run endpoint. Hand-assembling that from
# `services:` blocks would drift from how the stack actually runs, so this
# uses the project's own docker-compose file — the same command the README
# gives for local development.
#
# It needs a GEMINI_API_KEY repository secret. Without it the job exits
# early and says so, rather than failing noisily on every scheduled run.

on:
  schedule:
    # Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      categories:
        description: "Comma-separated categories to run (blank = all nine)"
        required: false
        default: ""

jobs:
  evaluate:
    name: Grounding evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check for an API key
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "No GEMINI_API_KEY secret is configured; skipping the evaluation." >> "$GITHUB_STEP_SUMMARY"
            echo "have_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write .env for the stack
        if: steps.guard.outputs.have_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          # docker-compose reads .env. Start from the committed example so
          # any new variable added there is picked up automatically, then
          # override only what CI needs.
          cp .env.example .env
          {
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "ATLASAI_SECRET_KEY=eval-only-not-a-real-secret"
            echo "JWT_SIGNING_KEY=eval-only-not-a-real-secret"
          } >> .env

      - name: Start the stack
        if: steps.guard.outputs.have_key == 'true'
        run: |
          docker compose up -d
          echo "Waiting for the API to answer readiness..."
          # First boot downloads the ClamAV signature database and the
          # embedding model, so this legitimately takes several minutes.
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8000/readyz >/dev/null; then
              echo "API is ready"; exit 0
            fi
            sleep 10
          done
          echo "API never became ready:"
          docker compose ps
          docker compose logs --tail 100 api embedder clamav
          exit 1

      - name: Install uv
        if: steps.guard.outputs.have_key == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.guard.outputs.have_key == 'true'
        run: uv python install 3.12

      - name: Sync workspace
        if: steps.guard.outputs.have_key == 'true'
        # The harness is a plain HTTP client against the running stack, so
        # it does not need the embedder extra — that model runs in Docker.
        run: uv sync --all-packages

      - name: Apply migrations
        if: steps.guard.outputs.have_key == 'true'
        # Source the same .env the stack was started from rather than
        # restating the DSN here — a hardcoded copy silently drifts from
        # whatever credentials compose actually brought Postgres up with.
        run: |
          set -a && . ./.env && set +a
          uv run alembic -c alembic.ini upgrade head

      - name: Run the evaluation harness
        if: steps.guard.outputs.have_key == 'true'
        run: |
          uv run python -m atlasai_evaluation.cli \
            --base-url http://localhost:8000 \
            --categories "${{ inputs.categories }}" \
            --output eval-report.json

      - name: Publish the metric table
        # Runs even when the harness exited non-zero on a threshold breach,
        # because that is exactly when the numbers are worth reading.
        if: always() && steps.guard.outputs.have_key == 'true' && hashFiles('eval-report.json') != ''
        run: uv run python -m atlasai_evaluation.cli --summarize eval-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the full report
        if: always() && steps.guard.outputs.have_key == 'true' && hashFiles('eval-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: eval-report.json

      - name: Stack logs on failure
        if: failure() && steps.guard.outputs.have_key == 'true'
        run: docker compose logs --tail 200

      - name: Tear down
        if: always() && steps.guard.outputs.have_key == 'true'
        run: docker compose down -v
