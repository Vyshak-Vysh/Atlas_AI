[project]
name = "atlasai-domain"
version = "0.1.0"
description = "AtlasAI shared domain contracts: enums, state machines, Pydantic I/O models. No DB/HTTP dependency."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_domain"]
