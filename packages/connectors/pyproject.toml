[project]
name = "atlasai-connectors"
version = "0.1.0"
description = "Connector protocol + provider adapters (manual upload, Git/CI, Gmail, MS Graph, Drive, meetings, PM)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "pymupdf>=1.24",
  "pypdf>=5.1",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "pytesseract>=0.3.13",
  "pillow>=11.0",
  "filetype>=1.2",
  "clamd>=1.0.2",
  "webvtt-py>=0.5",
  "srt>=3.5",
  "google-api-python-client>=2.149",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "atlasai-domain",
  "atlasai-db",
  "atlasai-security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_connectors"]
