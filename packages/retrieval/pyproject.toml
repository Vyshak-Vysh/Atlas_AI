[project]
name = "atlasai-retrieval"
version = "0.1.0"
description = "Hybrid (full-text + pgvector) retrieval, reranking, and evidence-packet building."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.35",
  "httpx>=0.28",
  "atlasai-domain",
  "atlasai-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_retrieval"]
