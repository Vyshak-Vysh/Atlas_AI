[project]
name = "atlasai-evaluation"
version = "0.1.0"
description = "Fixture-driven evaluation harness and scoring metrics (recall@k, citation coverage, unsupported-assertion rate, conflict precision)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyyaml>=6.0",
  "httpx>=0.28",
  "atlasai-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_evaluation"]
