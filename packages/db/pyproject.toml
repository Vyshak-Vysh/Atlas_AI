[project]
name = "atlasai-db"
version = "0.1.0"
description = "AtlasAI SQLAlchemy models, engine factories, and the tenant/project-scoped repository layer."
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy>=2.0.35",
  "asyncpg>=0.30",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.13",
  "pydantic-settings>=2.6",
  "boto3>=1.35",
  "redis>=5.2",
  "atlasai-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_db"]
