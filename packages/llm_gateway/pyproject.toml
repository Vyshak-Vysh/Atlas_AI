[project]
name = "atlasai-llm-gateway"
version = "0.1.0"
description = "Anthropic provider adapter, structured-output validation, retry/fallback, cost/token tracking."
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=0.69",
  "tenacity>=9.0",
  "atlasai-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_llm_gateway"]
