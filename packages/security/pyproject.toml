[project]
name = "atlasai-security"
version = "0.1.0"
description = "RBAC helpers, credential-ref envelope encryption, payload hashing, and log/prompt redaction."
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43.0",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "structlog>=24.4",
  "atlasai-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_security"]
