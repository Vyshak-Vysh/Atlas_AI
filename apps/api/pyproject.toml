[project]
name = "atlasai-api"
version = "0.1.0"
description = "AtlasAI FastAPI control plane: auth, tenants/projects, uploads, approvals, audit, SSE realtime gateway."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "python-multipart>=0.0.12",
  "sse-starlette>=2.1",
  "redis>=5.2",
  "celery>=5.4",
  "structlog>=24.4",
  "atlasai-domain",
  "atlasai-db",
  "atlasai-security",
  "atlasai-retrieval",
  "atlasai-connectors",
  "atlasai-llm-gateway",
  "atlasai-evaluation",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasai_api"]
